<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Active Blogs</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .page-title {
      margin: 0 0 18px;
      font-size: 32px;
    }
    .blog-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    }
    .blog-card {
      border: 1px solid #dbe2ea;
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .image-link {
      display: block;
      background: #e2e8f0;
      height: 190px;
      text-decoration: none;
    }
    .featured-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .image-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
      font-size: 14px;
    }
    .card-content {
      padding: 14px;
    }
    .blog-title {
      margin: 0 0 8px;
      font-size: 22px;
      line-height: 1.3;
    }
    .short-desc {
      margin: 0 0 10px;
      color: #334155;
      line-height: 1.5;
    }
    .meta {
      margin: 6px 0;
      font-size: 14px;
      line-height: 1.5;
    }
    .meta-label {
      font-weight: 700;
      color: #0f172a;
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }
    .views {
      font-weight: 700;
      color: #1e293b;
      font-size: 14px;
    }
    .view-btn {
      text-decoration: none;
      background: #2563eb;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
    }
    .empty {
      margin-top: 14px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="page-title">Active Blogs</h1>
    <div id="blogListRoot">
      <p class="empty">Loading active blogs...</p>
    </div>
  </div>

  <script>
    (function () {
      const storageKey = 'frontend_blog_view_counts';
      const listRoot = document.getElementById('blogListRoot');

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function authorName(author) {
        if (!author) {
          return 'Unknown';
        }
        const firstName = String(author.firstName || '').trim();
        const username = String(author.username || '').trim();
        return firstName || username || 'Unknown';
      }

      function joinNames(items) {
        if (!items || !items.length) {
          return '-';
        }
        return items
          .map(function (item) { return item && item.name ? item.name : ''; })
          .filter(Boolean)
          .join(', ') || '-';
      }

      function readStoredCounts() {
        const raw = localStorage.getItem(storageKey);
        if (!raw) {
          return {};
        }
        try {
          return JSON.parse(raw);
        } catch (error) {
          return {};
        }
      }

      function applyStoredCounts() {
        const counts = readStoredCounts();
        const countElements = document.querySelectorAll('.blog-view-count[data-blog-id]');
        countElements.forEach(function (element) {
          const blogId = element.getAttribute('data-blog-id');
          if (Object.prototype.hasOwnProperty.call(counts, blogId)) {
            element.textContent = counts[blogId];
          }
        });
      }

      async function graphQLRequest(query, variables) {
        const response = await fetch('/graphql/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({ query: query, variables: variables || {} })
        });

        const payload = await response.json();
        if (!response.ok || (payload.errors && payload.errors.length)) {
          const message = payload.errors && payload.errors.length
            ? payload.errors.map(function (item) { return item.message; }).join(' | ')
            : 'Failed to load blogs.';
          throw new Error(message);
        }

        return payload.data;
      }

      function renderBlogs(blogs) {
        if (!blogs.length) {
          listRoot.innerHTML = '<p class="empty">No active blogs available.</p>';
          return;
        }

        const cards = blogs.map(function (blog) {
          const detailUrl = '/blogs/' + encodeURIComponent(blog.slug || '') + '/';
          const featuredBlock = blog.featuredImage
            ? '<img class="featured-image" src="' + escapeHtml(blog.featuredImage) + '" alt="' + escapeHtml(blog.title || 'Blog image') + '" />'
            : '<div class="image-placeholder">No featured image</div>';

          return ''
            + '<article class="blog-card">'
            + '  <a class="image-link" href="' + detailUrl + '">' + featuredBlock + '</a>'
            + '  <div class="card-content">'
            + '    <h2 class="blog-title">' + escapeHtml(blog.title || '-') + '</h2>'
            + '    <p class="short-desc">' + escapeHtml(blog.shortDescription || '-') + '</p>'
            + '    <p class="meta"><span class="meta-label">Author:</span> ' + escapeHtml(authorName(blog.author)) + '</p>'
            + '    <p class="meta"><span class="meta-label">Categories:</span> ' + escapeHtml(joinNames(blog.categories)) + '</p>'
            + '    <p class="meta"><span class="meta-label">Tags:</span> ' + escapeHtml(joinNames(blog.tags)) + '</p>'
            + '    <div class="actions">'
            + '      <div class="views">Views: <span class="blog-view-count" data-blog-id="' + escapeHtml(blog.id) + '">' + escapeHtml(blog.viewCount || 0) + '</span></div>'
            + '      <a class="view-btn" href="' + detailUrl + '">View</a>'
            + '    </div>'
            + '  </div>'
            + '</article>';
        }).join('');

        listRoot.innerHTML = '<div class="blog-grid">' + cards + '</div>';
      }

      async function loadBlogs() {
        try {
          const data = await graphQLRequest(
            'query PublicBlogList($limit: Int) {'
            + ' blogFeed: blogs(isActive: true, limit: $limit) {'
            + ' id title slug shortDescription viewCount featuredImage'
            + ' author { username firstName }'
            + ' categories { name }'
            + ' tags { name }'
            + ' }'
            + ' }',
            { limit: 100 }
          );

          const blogs = data && data.blogFeed ? data.blogFeed : [];
          renderBlogs(blogs);
          applyStoredCounts();
        } catch (error) {
          listRoot.innerHTML = '<p class="empty">' + escapeHtml(error.message || 'Failed to load blogs.') + '</p>';
        }
      }

      window.addEventListener('storage', function (event) {
        if (event.key === storageKey) {
          applyStoredCounts();
        }
      });

      loadBlogs();
    })();
  </script>
</body>
</html>
