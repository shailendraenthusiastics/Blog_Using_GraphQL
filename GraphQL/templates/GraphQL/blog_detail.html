<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Detail</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .page-title {
      margin: 0;
      font-size: 32px;
      line-height: 1.25;
    }
    .back-btn {
      text-decoration: none;
      border: 1px solid #2563eb;
      color: #2563eb;
      background: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 700;
    }
    .panel {
      border: 1px solid #dbe2ea;
      border-radius: 12px;
      background: #fff;
      overflow: hidden;
    }
    .featured-image {
      width: 100%;
      max-height: 430px;
      object-fit: cover;
      display: block;
      background: #e2e8f0;
    }
    .content {
      padding: 16px;
    }
    .meta {
      margin: 8px 0;
      line-height: 1.5;
      font-size: 16px;
    }
    .meta-label {
      font-weight: 700;
      color: #0f172a;
    }
    .description {
      margin-top: 14px;
      border-top: 1px solid #e2e8f0;
      padding-top: 14px;
      line-height: 1.7;
      color: #1e293b;
    }
    .gallery-title {
      margin: 20px 0 10px;
      font-size: 20px;
    }
    .gallery-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    }
    .gallery-image {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid #dbe2ea;
      background: #e2e8f0;
    }
    .muted {
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-row">
      <h1 class="page-title" id="detailTitle">Blog Detail</h1>
      <a class="back-btn" href="/blogs/">Back to Blogs</a>
    </div>

    <div class="panel">
      <img id="detailFeaturedImage" class="featured-image" src="" alt="Featured image" style="display:none;" />

      <div class="content">
        <p class="meta"><span class="meta-label">Short Description:</span> <span id="detailShortDescription">-</span></p>
        <p class="meta"><span class="meta-label">Slug:</span> <span id="detailSlug">-</span></p>
        <p class="meta"><span class="meta-label">Author:</span> <span id="detailAuthor">Unknown</span></p>
        <p class="meta"><span class="meta-label">Categories:</span> <span id="detailCategories">-</span></p>
        <p class="meta"><span class="meta-label">Tags:</span> <span id="detailTags">-</span></p>
        <p class="meta"><span class="meta-label">Views:</span> <span id="detail-view-count">0</span></p>

        <div class="description">
          <p class="meta"><span class="meta-label">Description:</span></p>
          <div id="detailDescription">-</div>
        </div>

        <h2 class="gallery-title">Gallery Images</h2>
        <div id="galleryRoot"><p class="muted">No gallery images available.</p></div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const storageKey = 'frontend_blog_view_counts';
      const detailTitle = document.getElementById('detailTitle');
      const detailFeaturedImage = document.getElementById('detailFeaturedImage');
      const detailShortDescription = document.getElementById('detailShortDescription');
      const detailSlug = document.getElementById('detailSlug');
      const detailAuthor = document.getElementById('detailAuthor');
      const detailCategories = document.getElementById('detailCategories');
      const detailTags = document.getElementById('detailTags');
      const detailViewCountElement = document.getElementById('detail-view-count');
      const detailDescription = document.getElementById('detailDescription');
      const galleryRoot = document.getElementById('galleryRoot');

      function parseSlugFromPath() {
        const match = window.location.pathname.match(/^\/blogs\/([^/]+)\/?$/);
        return match ? decodeURIComponent(match[1]) : '';
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function authorName(author) {
        if (!author) {
          return 'Unknown';
        }
        const firstName = String(author.firstName || '').trim();
        const username = String(author.username || '').trim();
        return firstName || username || 'Unknown';
      }

      function joinNames(items) {
        if (!items || !items.length) {
          return '-';
        }
        return items
          .map(function (item) { return item && item.name ? item.name : ''; })
          .filter(Boolean)
          .join(', ') || '-';
      }

      async function graphQLRequest(query, variables) {
        const response = await fetch('/graphql/', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({ query: query, variables: variables || {} })
        });

        const payload = await response.json();
        if (!response.ok || (payload.errors && payload.errors.length)) {
          const message = payload.errors && payload.errors.length
            ? payload.errors.map(function (item) { return item.message; }).join(' | ')
            : 'Failed to load blog detail.';
          throw new Error(message);
        }

        return payload.data;
      }

      function readStoredCounts() {
        const raw = localStorage.getItem(storageKey);
        if (!raw) {
          return {};
        }
        try {
          return JSON.parse(raw);
        } catch (error) {
          return {};
        }
      }

      function saveCount(blogId, countValue) {
        const counts = readStoredCounts();
        counts[String(blogId)] = countValue;
        localStorage.setItem(storageKey, JSON.stringify(counts));
      }

      function renderGallery(gallery, blogTitle) {
        if (!gallery || !gallery.length) {
          galleryRoot.innerHTML = '<p class="muted">No gallery images available.</p>';
          return;
        }

        const galleryHtml = gallery.map(function (image) {
          return '<img class="gallery-image" src="' + escapeHtml(image.image || '') + '" alt="' + escapeHtml(blogTitle || 'Blog') + ' gallery" />';
        }).join('');

        galleryRoot.innerHTML = '<div class="gallery-grid">' + galleryHtml + '</div>';
      }

      async function incrementViewCount(slug, blogId) {
        const endpoint = '/blogs/' + encodeURIComponent(slug) + '/increment-view/';

        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: {
              'X-Requested-With': 'XMLHttpRequest'
            }
          });
          const data = await response.json();

          if (!data || typeof data.view_count === 'undefined') {
            return;
          }

          detailViewCountElement.textContent = data.view_count;
          if (typeof data.blog_id !== 'undefined') {
            saveCount(data.blog_id, data.view_count);
          } else if (typeof blogId !== 'undefined') {
            saveCount(blogId, data.view_count);
          }
        } catch (error) {
        }
      }

      async function loadDetail() {
        const slug = parseSlugFromPath();
        if (!slug) {
          detailTitle.textContent = 'Blog not found';
          detailDescription.textContent = 'Invalid blog URL.';
          return;
        }

        try {
          const data = await graphQLRequest(
            'query PublicBlogDetail($slug: String!) {'
            + ' blogEntry: blog(slug: $slug) {'
            + ' id title slug shortDescription description viewCount featuredImage'
            + ' author { username firstName }'
            + ' categories { name }'
            + ' tags { name }'
            + ' gallery { image }'
            + ' }'
            + ' }',
            { slug: slug }
          );

          const blog = data && data.blogEntry ? data.blogEntry : null;
          if (!blog) {
            throw new Error('Blog not found.');
          }

          detailTitle.textContent = blog.title || 'Blog Detail';
          document.title = blog.title || 'Blog Detail';
          detailShortDescription.textContent = blog.shortDescription || '-';
          detailSlug.textContent = blog.slug || '-';
          detailAuthor.textContent = authorName(blog.author);
          detailCategories.textContent = joinNames(blog.categories);
          detailTags.textContent = joinNames(blog.tags);
          detailViewCountElement.textContent = blog.viewCount || 0;

          detailDescription.innerHTML = blog.description || '-';

          if (blog.featuredImage) {
            detailFeaturedImage.src = blog.featuredImage;
            detailFeaturedImage.alt = blog.title || 'Featured image';
            detailFeaturedImage.style.display = 'block';
          } else {
            detailFeaturedImage.style.display = 'none';
          }

          renderGallery(blog.gallery || [], blog.title || 'Blog');
          incrementViewCount(slug, blog.id);
        } catch (error) {
          detailTitle.textContent = 'Blog not found';
          detailDescription.textContent = error.message || 'Failed to load blog detail.';
        }
      }

      loadDetail();
    })();
  </script>
</body>
</html>
