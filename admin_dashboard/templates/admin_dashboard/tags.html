{% extends 'admin_dashboard/dashboard_base.html' %}

{% block title %}Tags{% endblock %}

{% block content %}
<div class="top-row">
  <h1 class="page-title">Tag List</h1>
  <a class="btn" href="{% url 'admin_dashboard:dashboard_tag_add' %}">Add Tag</a>
</div>

<div id="tagListSuccess" class="message success" style="display:none; margin-bottom:10px;"></div>
<div id="tagListError" class="message error" style="display:none; margin-bottom:10px;"></div>

<form class="filter-row" onsubmit="return false;">
  <label for="status" style="font-size:22px;">Status</label>
  <select id="status" name="status">
    <option value="all">All</option>
    <option value="active">Active</option>
    <option value="inactive">Inactive</option>
  </select>
</form>

<div class="panel">
  <table>
    <thead>
      <tr>
        <th>S.No</th>
        <th>Name</th>
        <th>Slug</th>
        <th>Status</th>
        <th>Created</th>
        <th>Updated</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="tagTableRows">
      <tr><td colspan="7" class="muted">Loading tags...</td></tr>
    </tbody>
  </table>
</div>

<div class="filter-links" id="tagPagination"></div>

<script>
const TAGS_PER_PAGE = 10;
let allTags = [];
let currentPage = 1;

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function formatDate(value) {
  if (!value) {
    return "-";
  }
  const parsed = new Date(value);
  if (Number.isNaN(parsed.getTime())) {
    return "-";
  }
  return parsed.toLocaleString();
}

function setTagError(message) {
  const errorBox = document.getElementById("tagListError");
  if (!errorBox) {
    return;
  }
  if (!message) {
    errorBox.style.display = "none";
    errorBox.textContent = "";
    return;
  }
  errorBox.style.display = "block";
  errorBox.textContent = message;
}

function showTagSuccessMessage() {
  let message = "";
  try {
    message = sessionStorage.getItem("dashboard_tag_success") || "";
    if (message) {
      sessionStorage.removeItem("dashboard_tag_success");
    }
  } catch (storageError) {
    message = "";
  }

  const successBox = document.getElementById("tagListSuccess");
  if (!successBox) {
    return;
  }

  if (!message) {
    setTagSuccess("");
    return;
  }

  setTagSuccess(message);
}

function setTagSuccess(message) {
  const successBox = document.getElementById("tagListSuccess");
  if (!successBox) {
    return;
  }

  if (!message) {
    successBox.style.display = "none";
    successBox.textContent = "";
    return;
  }

  successBox.style.display = "block";
  successBox.textContent = message;
}

async function graphQLRequest(query, variables) {
  const response = await fetch("/graphql/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    credentials: "include",
    body: JSON.stringify({
      query: query,
      variables: variables || {}
    })
  });

  const payload = await response.json();
  if (!response.ok || (payload.errors && payload.errors.length)) {
    const message = payload.errors && payload.errors.length
      ? payload.errors.map(function (item) { return item.message; }).join(" | ")
      : "Request failed.";
    throw new Error(message);
  }

  return payload.data;
}

function getStatusVariable() {
  const status = document.getElementById("status").value;
  if (status === "active") {
    return true;
  }
  if (status === "inactive") {
    return false;
  }
  return null;
}

function renderPagination() {
  const pagination = document.getElementById("tagPagination");
  if (!pagination) {
    return;
  }

  const totalPages = Math.ceil(allTags.length / TAGS_PER_PAGE);
  if (totalPages <= 1) {
    pagination.innerHTML = "";
    return;
  }

  let html = "";

  if (currentPage > 1) {
    html += "<button class='chip-link nav' type='button' onclick='goToTagPage(" + (currentPage - 1) + ")'>Previous</button>";
  }

  for (let page = 1; page <= totalPages; page += 1) {
    const activeClass = page === currentPage ? "active" : "";
    html += "<button class='chip-link " + activeClass + "' type='button' onclick='goToTagPage(" + page + ")'>" + page + "</button>";
  }

  if (currentPage < totalPages) {
    html += "<button class='chip-link nav' type='button' onclick='goToTagPage(" + (currentPage + 1) + ")'>Next</button>";
  }

  pagination.innerHTML = html;
}

function renderTags() {
  const table = document.getElementById("tagTableRows");
  if (!table) {
    return;
  }

  if (!allTags.length) {
    table.innerHTML = "<tr><td colspan='7' class='muted'>No tags found.</td></tr>";
    renderPagination();
    return;
  }

  const start = (currentPage - 1) * TAGS_PER_PAGE;
  const pageItems = allTags.slice(start, start + TAGS_PER_PAGE);

  table.innerHTML = pageItems.map(function (tag, index) {
    const statusClass = tag.isActive ? "active" : "inactive";
    const statusText = tag.isActive ? "Active" : "Inactive";

    return ""
      + "<tr>"
      + "<td>" + (start + index + 1) + "</td>"
      + "<td><a class='link-btn' href='/admin-dashboard/dashboard/tags/" + tag.id + "/'>" + escapeHtml(tag.name) + "</a></td>"
      + "<td>" + escapeHtml(tag.slug || "-") + "</td>"
      + "<td><span class='tag " + statusClass + "'>" + statusText + "</span></td>"
      + "<td>" + escapeHtml(formatDate(tag.createdAt)) + "</td>"
      + "<td>" + escapeHtml(formatDate(tag.updatedAt)) + "</td>"
      + "<td><div class='action-row'>"
      + "<a class='link-btn' href='/admin-dashboard/dashboard/tags/" + tag.id + "/edit/'>Edit</a>"
        + "<button type='button' class='action-btn' onclick='deleteTag(\"" + String(tag.id) + "\", " + (tag.isActive ? "true" : "false") + ")'>Delete</button>"
      + "</div></td>"
      + "</tr>";
  }).join("");

  renderPagination();
}

function goToTagPage(page) {
  currentPage = page;
  renderTags();
}

async function loadTags() {
  setTagError("");
  const table = document.getElementById("tagTableRows");
  if (table) {
    table.innerHTML = "<tr><td colspan='7' class='muted'>Loading tags...</td></tr>";
  }

  try {
    const data = await graphQLRequest(
      "query AdminTagList($isActive: Boolean) {"
      + " adminTags(isActive: $isActive) {"
      + " id name slug isActive createdAt updatedAt"
      + " }"
      + " }",
      { isActive: getStatusVariable() }
    );
    allTags = data.adminTags || [];
    currentPage = 1;
    renderTags();
  } catch (error) {
    setTagError(error.message || "Failed to load tags.");
    if (table) {
      table.innerHTML = "<tr><td colspan='7' class='muted'>Unable to load tags.</td></tr>";
    }
    const pagination = document.getElementById("tagPagination");
    if (pagination) {
      pagination.innerHTML = "";
    }
  }
}

async function deleteTag(id, isActive) {
  const isCurrentlyActive = Boolean(isActive);
  const confirmationMessage = isCurrentlyActive
    ? "This tag is active. Move it to inactive?"
    : "This tag is inactive. Activate it again?";

  if (!confirm(confirmationMessage)) {
    return;
  }

  setTagSuccess("");
  setTagError("");

  try {
    const data = await graphQLRequest(
      "mutation DeleteTag($id: ID!) {"
      + " deleteTag(id: $id) { success }"
      + " }",
      { id: id }
    );

    if (!data.deleteTag || !data.deleteTag.success) {
      throw new Error("Delete operation was not successful.");
    }

    setTagSuccess(isCurrentlyActive ? "Tag moved to inactive." : "Tag activated successfully.");

    await loadTags();
  } catch (error) {
    setTagError(error.message || "Failed to delete tag.");
  }
}

document.getElementById("status").addEventListener("change", loadTags);
showTagSuccessMessage();
loadTags();
</script>
{% endblock %}
