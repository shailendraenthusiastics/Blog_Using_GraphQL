<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f4f6; color: #111827; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: #e5e7eb; border-right: 1px solid #cbd5e1; padding: 20px 14px; }
    .sidebar h2 { margin: 0 0 24px; font-size: 15px; color: #1f2937; }
    .nav-link { display: block; color: #2563eb; text-decoration: none; font-size: 20px; margin: 14px 0; }
    .nav-link.active { font-weight: 400; }
    .content { flex: 1; padding: 20px 18px; }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .page-title { margin: 0; font-size: 20px; color: #0f172a; }
    .btn { display: inline-block; border: 1px solid #16a34a; background: #16a34a; color: #fff; text-decoration: none; padding: 10px 16px; border-radius: 7px; font-size: 15px; cursor: pointer; }
    .btn.secondary { border-color: #2563eb; background: #fff; color: #2563eb; }
    .panel { background: #fff; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #1f2937; color: #fff; text-align: left; padding: 12px; font-size: 16px; }
    td { padding: 12px; border-bottom: 1px solid #e5e7eb; font-size: 16px; vertical-align: top; }
    .center-head { text-align: center; }
    .center-col { text-align: center; }
    .col-start { display: inline-block; width: 240px; max-width: 100%; }
    .col-head { text-align: center; font-weight: 500; }
    .col-detail {
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      vertical-align: top;
    }
    .slug-value { font-family: inherit; color: inherit; }
    .tag { display: inline-block; border-radius: 999px; font-size: 15px; padding: 5px 12px; color: #fff; }
    .tag.active { background: #16a34a; }
    .tag.inactive { background: #64748b; }
    .thumb { width: 120px; height: 80px; object-fit: cover; border-radius: 6px; background: #e5e7eb; }
    .message { padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 15px; }
    .message.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .muted { color: #6b7280; font-size: 15px; }
    .link-btn { color: #2563eb; text-decoration: none; font-size: inherit; }
    .home-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      text-align: center;
    }
    .home-card {
      border-radius: 10px;
      padding: 14px 10px;
      min-height: 96px;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }
    .home-card .label { font-size: 16px; font-weight: 500; margin-bottom: 6px; line-height: 1.25; }
    .home-card .value { font-size: 24px; font-weight: 600; line-height: 1.1; }
    .home-card.blog { background: #1d4ed8; }
    .home-card.tag { background: #16a34a; }
    .home-card.category { background: #f59e0b; }

    @media (max-width: 1100px) {
      .home-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .home-stats { grid-template-columns: 1fr; }
      .home-card { min-height: 88px; padding: 12px 10px; }
      .home-card .label { font-size: 15px; }
      .home-card .value { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>DASHBOARD</h2>
      <a class="nav-link active" href="/admin-dashboard/dashboard/">Home</a>
      <a class="nav-link" href="/admin-dashboard/dashboard/blogs/">Blogs</a>
      <a class="nav-link" href="/admin-dashboard/dashboard/categories/">Categories</a>
      <a class="nav-link" href="/admin-dashboard/dashboard/tags/">Tags</a>
    </aside>

    <main class="content">
      <div class="top-row">
        <h1 class="page-title">Home</h1>
        <button id="logoutButton" class="btn secondary" type="button">Logout</button>
      </div>

      <div id="homeError" class="message error" style="display:none; margin-bottom: 10px;"></div>

      <div class="panel" style="padding: 10px; box-shadow:none; margin-bottom: 10px; border:none;">
        <div class="home-stats">
          <div class="home-card blog">
            <div class="label">Total Blog</div>
            <div class="value" id="totalBlogs">0</div>
          </div>
          <div class="home-card tag">
            <div class="label">Inactive Blogs</div>
            <div class="value" id="inactiveBlogs">0</div>
          </div>
          <div class="home-card category">
            <div class="label">Active Blogs</div>
            <div class="value" id="activeBlogs">0</div>
          </div>
        </div>
      </div>

      <div class="panel" style="padding: 10px; margin-top: 10px; border:none; box-shadow:none; margin-bottom: 10px;">
        <div class="home-stats">
          <div class="home-card blog">
            <div class="label">Total Category</div>
            <div class="value" id="totalCategories">0</div>
          </div>
          <div class="home-card tag">
            <div class="label">Inactive Category</div>
            <div class="value" id="inactiveCategories">0</div>
          </div>
          <div class="home-card category">
            <div class="label">Active Category</div>
            <div class="value" id="activeCategories">0</div>
          </div>
        </div>
      </div>

      <div class="panel" style="padding: 10px; margin-top: 10px; border:none; box-shadow:none; margin-bottom: 10px;">
        <div class="home-stats">
          <div class="home-card blog">
            <div class="label">Total Tags</div>
            <div class="value" id="totalTags">0</div>
          </div>
          <div class="home-card tag">
            <div class="label">Inactive Tags</div>
            <div class="value" id="inactiveTags">0</div>
          </div>
          <div class="home-card category">
            <div class="label">Active Tags</div>
            <div class="value" id="activeTags">0</div>
          </div>
        </div>
      </div>

      <div class="panel" style="padding: 10px; margin-top: 10px; border:none; box-shadow:none;">
        <div class="top-row" style="margin-bottom: 10px;">
          <h1 class="page-title" style="font-size: 15px;">Recent Blogs (10)</h1>
          <a class="link-btn" href="/admin-dashboard/dashboard/blogs/">Show All</a>
        </div>

        <table>
          <thead>
            <tr>
              <th>S.No</th>
              <th class="center-head"><span class="col-start col-head">Title</span></th>
              <th>Featured</th>
              <th class="center-head"><span class="col-start col-head">Slug</span></th>
              <th>Author</th>
              <th>Created At</th>
              <th>Updated At</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="homeBlogRows">
            <tr>
              <td colspan="8" class="muted">Loading blogs...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

<script>
function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function authorName(author) {
  if (!author) {
    return "Unknown";
  }
  const username = (author.username || "").trim();
  const cleanedUsername = username.replace(/_[0-9]+$/, "");
  return cleanedUsername || username || "Unknown";
}

function featuredImageUrl(blogId) {
  return "/admin-dashboard/dashboard/blogs/" + encodeURIComponent(blogId) + "/featured-image/";
}

function formatDate(value) {
  if (!value) {
    return "-";
  }
  const parsed = new Date(value);
  if (Number.isNaN(parsed.getTime())) {
    return "-";
  }
  return parsed.toLocaleString();
}

function setError(message) {
  const errorBox = document.getElementById("homeError");
  if (!errorBox) {
    return;
  }
  if (!message) {
    errorBox.style.display = "none";
    errorBox.textContent = "";
    return;
  }
  errorBox.style.display = "block";
  errorBox.textContent = message;
}

async function fetchGraphQL(query, variables) {
  const response = await fetch("/graphql/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    credentials: "include",
    body: JSON.stringify({ query: query, variables: variables || {} })
  });

  const payload = await response.json();

  if (!response.ok || (payload.errors && payload.errors.length)) {
    const errorMessage = payload.errors && payload.errors.length
      ? payload.errors.map(function (item) { return item.message; }).join(" | ")
      : "Failed to fetch dashboard data.";
    throw new Error(errorMessage);
  }

  return payload.data;
}

function renderRecentBlogs(blogs) {
  const rows = document.getElementById("homeBlogRows");
  if (!rows) {
    return;
  }

  if (!blogs.length) {
    rows.innerHTML = "<tr><td colspan='8' class='muted'>No blogs found.</td></tr>";
    return;
  }

  rows.innerHTML = blogs.map(function (blog, index) {
    const safeTitle = escapeHtml(blog.title || "-");
    const safeSlug = escapeHtml(blog.slug || "-");
    const safeAuthor = escapeHtml(authorName(blog.author));
    const statusClass = blog.isActive ? "active" : "inactive";
    const statusText = blog.isActive ? "Active" : "Inactive";

    return ""
      + "<tr>"
      + "<td>" + (index + 1) + "</td>"
      + "<td class='center-col'><span class='col-start col-detail' title='" + safeTitle + "'>" + safeTitle + "</span></td>"
      + "<td><img class='thumb' src='" + featuredImageUrl(blog.id) + "' alt='Featured image for " + safeTitle + "' loading='lazy' decoding='async' /></td>"
      + "<td class='center-col'><span class='col-start col-detail slug-value' title='" + safeSlug + "'>" + safeSlug + "</span></td>"
      + "<td>" + safeAuthor + "</td>"
      + "<td>" + escapeHtml(formatDate(blog.createdAt)) + "</td>"
      + "<td>" + escapeHtml(formatDate(blog.updatedAt)) + "</td>"
      + "<td><span class='tag " + statusClass + "'>" + statusText + "</span></td>"
      + "</tr>";
  }).join("");
}

async function loadHomeData() {
  setError("");

  try {
    const data = await fetchGraphQL(
      "query HomeDashboard {"
      + " adminDashboardStats {"
      + " totalBlogs activeBlogs inactiveBlogs"
      + " totalCategories activeCategories inactiveCategories"
      + " totalTags activeTags inactiveTags"
      + " }"
      + " adminBlogs(isActive: true, limit: 10) {"
      + " id title slug isActive createdAt updatedAt"
      + " author { username }"
      + " }"
      + " }"
    );

    const stats = data.adminDashboardStats || {};
    document.getElementById("totalBlogs").textContent = stats.totalBlogs || 0;
    document.getElementById("inactiveBlogs").textContent = stats.inactiveBlogs || 0;
    document.getElementById("activeBlogs").textContent = stats.activeBlogs || 0;
    document.getElementById("totalCategories").textContent = stats.totalCategories || 0;
    document.getElementById("inactiveCategories").textContent = stats.inactiveCategories || 0;
    document.getElementById("activeCategories").textContent = stats.activeCategories || 0;
    document.getElementById("totalTags").textContent = stats.totalTags || 0;
    document.getElementById("inactiveTags").textContent = stats.inactiveTags || 0;
    document.getElementById("activeTags").textContent = stats.activeTags || 0;

    const recentBlogs = data.adminBlogs || [];
    renderRecentBlogs(recentBlogs);
  } catch (error) {
    setError(error.message || "Failed to load dashboard data.");
    const rows = document.getElementById("homeBlogRows");
    if (rows) {
      rows.innerHTML = "<tr><td colspan='8' class='muted'>Unable to load blogs.</td></tr>";
    }
  }
}

async function logoutDashboard() {
  try {
    await fetchGraphQL("mutation DashboardLogout { dashboardLogout { success message } }");
  } catch (error) {
  }
  window.location.href = "/admin-dashboard/login/";
}

document.getElementById("logoutButton").addEventListener("click", logoutDashboard);
loadHomeData();
</script>
</body>
</html>
