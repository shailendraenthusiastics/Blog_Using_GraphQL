<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog List</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f4f6; color: #111827; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: #e5e7eb; border-right: 1px solid #cbd5e1; padding: 20px 14px; }
    .sidebar h2 { margin: 0 0 24px; font-size: 15px; color: #1f2937; }
    .nav-link { display: block; color: #2563eb; text-decoration: none; font-size: 20px; margin: 14px 0; }
    .nav-link.active { font-weight: 400; }
    .content { flex: 1; padding: 20px 18px; }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .page-title { margin: 0; font-size: 20px; color: #0f172a; }
    .btn { display: inline-block; border: 1px solid #16a34a; background: #16a34a; color: #fff; text-decoration: none; padding: 10px 16px; border-radius: 7px; font-size: 15px; cursor: pointer; }
    .panel { background: #fff; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #1f2937; color: #fff; text-align: left; padding: 12px; font-size: 16px; }
    td { padding: 12px; border-bottom: 1px solid #e5e7eb; font-size: 16px; vertical-align: top; }
    .center-head { text-align: center; }
    .center-col { text-align: center; }
    .col-start { display: inline-block; width: 240px; max-width: 100%; }
    .col-head { text-align: center; font-weight: 500; }
    .col-detail {
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
      vertical-align: top;
    }
    .slug-value { font-family: inherit; color: inherit; }
    .tag { display: inline-block; border-radius: 999px; font-size: 15px; padding: 5px 12px; color: #fff; }
    .tag.active { background: #16a34a; }
    .tag.inactive { background: #64748b; }
    .thumb { width: 120px; height: 80px; object-fit: cover; border-radius: 6px; background: #e5e7eb; }
    .message { padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 15px; }
    .message.success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .message.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .muted { color: #6b7280; font-size: 15px; }
    .link-btn { color: #2563eb; text-decoration: none; font-size: inherit; }
    .action-row { display: flex; align-items: center; gap: 10px; flex-wrap: nowrap; white-space: nowrap; }
    .action-btn { background: none; border: none; color: #dc2626; cursor: pointer; font-size: 15px; padding: 0; }
    .filter-row { display: flex; gap: 10px; align-items: center; margin: 0 0 14px; }
    .filter-row select { width: auto; min-width: 160px; border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px 10px; font-size: 15px; }
    .filter-links { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .chip-link {
      min-width: 38px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 0 12px;
      text-decoration: none;
      color: #1f2937;
      font-size: 15px;
      background: #fff;
      box-sizing: border-box;
      cursor: pointer;
    }
    .chip-link:hover { border-color: #2563eb; color: #2563eb; background: #eff6ff; }
    .chip-link.active { border-color: #2563eb; background: #2563eb; color: #fff; font-weight: 400; pointer-events: none; }
    .chip-link.nav { font-weight: 400; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>DASHBOARD</h2>
      <a class="nav-link" href="/admin-dashboard/dashboard/">Home</a>
      <a class="nav-link active" href="/admin-dashboard/dashboard/blogs/">Blogs</a>
      <a class="nav-link" href="/admin-dashboard/dashboard/categories/">Categories</a>
      <a class="nav-link" href="/admin-dashboard/dashboard/tags/">Tags</a>
    </aside>

    <main class="content">
      <div class="top-row">
        <h1 class="page-title">Blog List</h1>
        <a class="btn" href="/admin-dashboard/dashboard/blogs/add/">Add Blog</a>
      </div>

      <div id="blogListSuccess" class="message success" style="display:none; margin-bottom:10px;"></div>
      <div id="blogListError" class="message error" style="display:none; margin-bottom:10px;"></div>

      <form class="filter-row" onsubmit="return false;">
        <label for="status" style="font-size:15px;">Status</label>
        <select id="status" name="status">
          <option value="all">All</option>
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </form>

      <div class="panel">
        <table>
          <thead>
            <tr>
              <th>S.No</th>
              <th class="center-head"><span class="col-start col-head">Title</span></th>
              <th>Featured</th>
              <th class="center-head"><span class="col-start col-head">Slug</span></th>
              <th>Author</th>
              <th>Status</th>
              <th>Created At</th>
              <th>Updated At</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="blogTableRows">
            <tr><td colspan="9" class="muted">Loading blogs...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="filter-links" id="blogPagination"></div>
    </main>
  </div>

<script>
const BLOGS_PER_PAGE = 10;
const BLOG_FETCH_LIMIT = 200;
let allBlogs = [];
let currentPage = 1;

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function featuredImageUrl(blogId) {
  return "/admin-dashboard/dashboard/blogs/" + encodeURIComponent(blogId) + "/featured-image/";
}

function authorName(author) {
  if (!author) {
    return "Unknown";
  }
  const username = (author.username || "").trim();
  const cleanedUsername = username.replace(/_[0-9]+$/, "");
  return cleanedUsername || username || "Unknown";
}

function formatDate(value) {
  if (!value) {
    return "-";
  }
  const parsed = new Date(value);
  if (Number.isNaN(parsed.getTime())) {
    return "-";
  }
  return parsed.toLocaleString();
}

function setBlogError(message) {
  const errorBox = document.getElementById("blogListError");
  if (!errorBox) {
    return;
  }
  if (!message) {
    errorBox.style.display = "none";
    errorBox.textContent = "";
    return;
  }
  errorBox.style.display = "block";
  errorBox.textContent = message;
}

function showBlogSuccessMessage() {
  let message = "";
  try {
    message = sessionStorage.getItem("dashboard_blog_success") || "";
    if (message) {
      sessionStorage.removeItem("dashboard_blog_success");
    }
  } catch (storageError) {
    message = "";
  }

  const successBox = document.getElementById("blogListSuccess");
  if (!successBox) {
    return;
  }

  if (!message) {
    setBlogSuccess("");
    return;
  }

  setBlogSuccess(message);
}

function setBlogSuccess(message) {
  const successBox = document.getElementById("blogListSuccess");
  if (!successBox) {
    return;
  }

  if (!message) {
    successBox.style.display = "none";
    successBox.textContent = "";
    return;
  }

  successBox.style.display = "block";
  successBox.textContent = message;
}

async function graphQLRequest(query, variables) {
  const response = await fetch("/graphql/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    credentials: "include",
    body: JSON.stringify({
      query: query,
      variables: variables || {}
    })
  });

  const payload = await response.json();
  if (!response.ok || (payload.errors && payload.errors.length)) {
    const message = payload.errors && payload.errors.length
      ? payload.errors.map(function (item) { return item.message; }).join(" | ")
      : "Request failed.";
    throw new Error(message);
  }
  return payload.data;
}

function statusVariable() {
  const status = document.getElementById("status").value;
  if (status === "active") {
    return true;
  }
  if (status === "inactive") {
    return false;
  }
  return null;
}

function renderBlogPagination() {
  const pagination = document.getElementById("blogPagination");
  if (!pagination) {
    return;
  }
  const totalPages = Math.ceil(allBlogs.length / BLOGS_PER_PAGE);
  if (totalPages <= 1) {
    pagination.innerHTML = "";
    return;
  }

  let html = "";
  if (currentPage > 1) {
    html += "<button class='chip-link nav' type='button' onclick='goToBlogPage(" + (currentPage - 1) + ")'>Previous</button>";
  }
  for (let page = 1; page <= totalPages; page += 1) {
    const activeClass = page === currentPage ? "active" : "";
    html += "<button class='chip-link " + activeClass + "' type='button' onclick='goToBlogPage(" + page + ")'>" + page + "</button>";
  }
  if (currentPage < totalPages) {
    html += "<button class='chip-link nav' type='button' onclick='goToBlogPage(" + (currentPage + 1) + ")'>Next</button>";
  }

  pagination.innerHTML = html;
}

function renderBlogs() {
  const table = document.getElementById("blogTableRows");
  if (!table) {
    return;
  }

  if (!allBlogs.length) {
    table.innerHTML = "<tr><td colspan='9' class='muted'>No blogs found.</td></tr>";
    renderBlogPagination();
    return;
  }

  const start = (currentPage - 1) * BLOGS_PER_PAGE;
  const pageItems = allBlogs.slice(start, start + BLOGS_PER_PAGE);

  table.innerHTML = pageItems.map(function (blog, index) {
    const statusClass = blog.isActive ? "active" : "inactive";
    const statusText = blog.isActive ? "Active" : "Inactive";
    const safeTitle = escapeHtml(blog.title || "-");
    const safeSlug = escapeHtml(blog.slug || "-");

    return ""
      + "<tr>"
      + "<td>" + (start + index + 1) + "</td>"
      + "<td class='center-col'><span class='col-start col-detail' title='" + safeTitle + "'>" + safeTitle + "</span></td>"
      + "<td><img class='thumb' src='" + featuredImageUrl(blog.id) + "' alt='Featured image for " + safeTitle + "' loading='lazy' decoding='async' /></td>"
      + "<td class='center-col'><span class='col-start col-detail slug-value' title='" + safeSlug + "'>" + safeSlug + "</span></td>"
      + "<td>" + escapeHtml(authorName(blog.author)) + "</td>"
      + "<td><span class='tag " + statusClass + "'>" + statusText + "</span></td>"
      + "<td>" + escapeHtml(formatDate(blog.createdAt)) + "</td>"
      + "<td>" + escapeHtml(formatDate(blog.updatedAt)) + "</td>"
      + "<td><div class='action-row'>"
      + "<a class='link-btn' href='/admin-dashboard/blogs/" + blog.id + "/edit/'>Edit</a>"
      + "<button type='button' class='action-btn' onclick='deleteBlog(\"" + String(blog.id) + "\", " + (blog.isActive ? "true" : "false") + ")'>Delete</button>"
      + "</div></td>"
      + "</tr>";
  }).join("");

  renderBlogPagination();
}

function goToBlogPage(page) {
  currentPage = page;
  renderBlogs();
}

async function loadBlogs() {
  setBlogError("");
  const table = document.getElementById("blogTableRows");
  if (table) {
    table.innerHTML = "<tr><td colspan='9' class='muted'>Loading blogs...</td></tr>";
  }

  try {
    const data = await graphQLRequest(
      "query AdminBlogList($isActive: Boolean, $limit: Int) {"
      + " adminBlogs(isActive: $isActive, limit: $limit) {"
      + " id title slug isActive createdAt updatedAt"
      + " author { username }"
      + " }"
      + " }",
      { isActive: statusVariable(), limit: BLOG_FETCH_LIMIT }
    );
    allBlogs = data.adminBlogs || [];
    currentPage = 1;
    renderBlogs();
  } catch (error) {
    setBlogError(error.message || "Failed to load blogs.");
    if (table) {
      table.innerHTML = "<tr><td colspan='9' class='muted'>Unable to load blogs.</td></tr>";
    }
    const pagination = document.getElementById("blogPagination");
    if (pagination) {
      pagination.innerHTML = "";
    }
  }
}

async function deleteBlog(id, isActive) {
  const isCurrentlyActive = Boolean(isActive);
  const confirmationMessage = isCurrentlyActive
    ? "This blog is active. Move it to inactive?"
    : "This blog is inactive. Activate it again?";

  if (!confirm(confirmationMessage)) {
    return;
  }

  setBlogSuccess("");
  setBlogError("");

  try {
    const data = await graphQLRequest(
      "mutation DeleteBlog($id: ID!) {"
      + " deleteBlog(id: $id) { ok }"
      + " }",
      { id: id }
    );

    if (!data.deleteBlog || !data.deleteBlog.ok) {
      throw new Error("Delete operation was not successful.");
    }

    setBlogSuccess(isCurrentlyActive ? "Blog moved to inactive." : "Blog activated successfully.");

    await loadBlogs();
  } catch (error) {
    setBlogError(error.message || "Failed to delete blog.");
  }
}

document.getElementById("status").addEventListener("change", loadBlogs);
showBlogSuccessMessage();
loadBlogs();
</script>
</body>
</html>
