<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Login</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 20px;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #2563eb;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    .messages {
      margin-bottom: 12px;
      color: #b91c1c;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin Dashboard Login</h1>

    <div id="loginError" class="messages" style="display:none;"></div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required />
      </div>

      <button id="loginButton" type="submit">Login</button>
    </form>
  </div>

<script>
function getNextUrl() {
  const params = new URLSearchParams(window.location.search);
  const nextValue = (params.get("next") || "").trim();
  if (!nextValue) {
    return "/admin-dashboard/dashboard/";
  }
  if (!nextValue.startsWith("/")) {
    return "/admin-dashboard/dashboard/";
  }
  if (nextValue.startsWith("//")) {
    return "/admin-dashboard/dashboard/";
  }
  if (nextValue === "/admin-dashboard/" || nextValue === "/admin-dashboard/login/") {
    return "/admin-dashboard/dashboard/";
  }
  return nextValue;
}

function setLoginError(message) {
  const errorBox = document.getElementById("loginError");
  if (!errorBox) {
    return;
  }
  if (!message) {
    errorBox.style.display = "none";
    errorBox.textContent = "";
    return;
  }
  errorBox.style.display = "block";
  errorBox.textContent = message;
}

async function graphQLRequest(query, variables) {
  const response = await fetch("/graphql/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    credentials: "include",
    body: JSON.stringify({
      query: query,
      variables: variables || {}
    })
  });

  const payload = await response.json();
  if (!response.ok || (payload.errors && payload.errors.length)) {
    const message = payload.errors && payload.errors.length
      ? payload.errors.map(function (item) { return item.message; }).join(" | ")
      : "Login failed.";
    throw new Error(message);
  }
  return payload.data;
}

document.getElementById("loginForm").addEventListener("submit", async function (event) {
  event.preventDefault();
  setLoginError("");

  const username = (document.getElementById("username").value || "").trim();
  const password = document.getElementById("password").value || "";
  const nextUrl = getNextUrl();

  if (!username || !password) {
    setLoginError("Username and password are required.");
    return;
  }

  const loginButton = document.getElementById("loginButton");
  loginButton.disabled = true;

  try {
    const data = await graphQLRequest(
      "mutation DashboardLogin($username: String!, $password: String!, $nextUrl: String) {"
      + " dashboardLogin(username: $username, password: $password, nextUrl: $nextUrl) {"
      + " success message nextUrl"
      + " }"
      + " }",
      {
        username: username,
        password: password,
        nextUrl: nextUrl
      }
    );

    const loginData = data.dashboardLogin;
    if (!loginData || !loginData.success) {
      throw new Error("Login failed.");
    }

    window.location.href = loginData.nextUrl || nextUrl;
  } catch (error) {
    setLoginError(error.message || "Login failed.");
  } finally {
    loginButton.disabled = false;
  }
});
</script>
</body>
</html>
