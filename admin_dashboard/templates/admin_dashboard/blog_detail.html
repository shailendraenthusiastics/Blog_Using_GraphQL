<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog Detail</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f4f6; color: #111827; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: #e5e7eb; border-right: 1px solid #cbd5e1; padding: 20px 14px; }
    .sidebar h2 { margin: 0 0 24px; font-size: 28px; color: #1f2937; }
    .nav-link { display: block; color: #2563eb; text-decoration: none; font-size: 32px; margin: 14px 0; }
    .nav-link.active { font-weight: 700; }
    .content { flex: 1; padding: 20px 18px; }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .page-title { margin: 0; font-size: 52px; color: #0f172a; }
    .btn { display: inline-block; border: 1px solid #2563eb; background: #fff; color: #2563eb; text-decoration: none; padding: 10px 16px; border-radius: 7px; font-size: 28px; cursor: pointer; }
    .panel { background: #fff; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; }
    .message { padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 22px; }
    .message.error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .thumb { width: 120px; height: 80px; object-fit: cover; border-radius: 6px; background: #e5e7eb; }
    .muted { color: #6b7280; font-size: 20px; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>DASHBOARD</h2>
      <a class="nav-link" href="/admin-dashboard/dashboard/">Home</a>
      <a class="nav-link active" href="/admin-dashboard/dashboard/blogs/">Blogs</a>
      <a class="nav-link" href="/admin-dashboard/dashboard/categories/">Categories</a>
      <a class="nav-link" href="/admin-dashboard/dashboard/tags/">Tags</a>
    </aside>

    <main class="content">
      <div class="top-row">
        <h1 class="page-title">Blog Detail</h1>
        <a class="btn" href="/admin-dashboard/dashboard/blogs/">Back to Blogs</a>
      </div>

      <div id="blogDetailError" class="message error" style="display:none; margin-bottom:10px;"></div>

      <div class="panel" style="padding:16px;">
        <div id="featuredImageWrapper" style="margin-bottom:10px; display:none;">
          <img id="featuredImage" class="thumb" style="width:220px;height:140px;" src="" alt="Featured Image" />
        </div>
        <p><strong>Title:</strong> <span id="blogTitle">-</span></p>
        <p><strong>Slug:</strong> <span id="blogSlug">-</span></p>
        <p><strong>Short Description:</strong> <span id="blogShortDescription">-</span></p>
        <p><strong>Description:</strong> <span id="blogDescription">-</span></p>
        <p><strong>Author:</strong> <span id="blogAuthor">-</span></p>
        <p><strong>View Count:</strong> <span id="blogViewCount">0</span></p>
        <p><strong>Status:</strong> <span id="blogStatus">-</span></p>
        <p><strong>Created:</strong> <span id="blogCreated">-</span></p>
        <p><strong>Updated:</strong> <span id="blogUpdated">-</span></p>
        <p><strong>Gallery Images:</strong></p>
        <div id="galleryImages" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;"></div>
        <p><strong>Categories:</strong> <span id="blogCategories">-</span></p>
        <p><strong>Tags:</strong> <span id="blogTags">-</span></p>
      </div>
    </main>
  </div>

<script>
function parseBlogIdFromPath() {
  const match = window.location.pathname.match(/\/blogs\/(\d+)\//);
  return match ? match[1] : null;
}

function getBlogId() {
  return parseBlogIdFromPath();
}

function stripHtml(value) {
  if (!value) {
    return "-";
  }
  const container = document.createElement("div");
  container.innerHTML = value;
  const text = (container.textContent || container.innerText || "").trim();
  return text || "-";
}

function formatDate(value) {
  if (!value) {
    return "-";
  }
  const parsed = new Date(value);
  if (Number.isNaN(parsed.getTime())) {
    return "-";
  }
  return parsed.toLocaleString();
}

function authorName(author) {
  if (!author) {
    return "Unknown";
  }
  const username = (author.username || "").trim();
  const cleanedUsername = username.replace(/_[0-9]+$/, "");
  return cleanedUsername || username || "Unknown";
}

function setBlogDetailError(message) {
  const errorBox = document.getElementById("blogDetailError");
  if (!errorBox) {
    return;
  }
  if (!message) {
    errorBox.style.display = "none";
    errorBox.textContent = "";
    return;
  }
  errorBox.style.display = "block";
  errorBox.textContent = message;
}

async function graphQLRequest(query, variables) {
  const response = await fetch("/graphql/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    credentials: "include",
    body: JSON.stringify({ query: query, variables: variables || {} })
  });

  const payload = await response.json();
  if (!response.ok || (payload.errors && payload.errors.length)) {
    const message = payload.errors && payload.errors.length
      ? payload.errors.map(function (item) { return item.message; }).join(" | ")
      : "Request failed.";
    throw new Error(message);
  }
  return payload.data;
}

function renderGallery(gallery) {
  const wrapper = document.getElementById("galleryImages");
  if (!wrapper) {
    return;
  }

  if (!gallery || !gallery.length) {
    wrapper.innerHTML = "<span class='muted'>-</span>";
    return;
  }

  wrapper.innerHTML = gallery.map(function (item) {
    return "<img class='thumb' src='" + item.image + "' alt='Gallery image' />";
  }).join("");
}

async function loadBlogDetail() {
  setBlogDetailError("");
  const blogId = getBlogId();
  if (!blogId) {
    setBlogDetailError("Blog ID is missing in URL.");
    return;
  }

  try {
    const data = await graphQLRequest(
      "query AdminBlogDetail($id: ID!) {"
      + " adminBlog(id: $id) {"
      + " id title slug shortDescription description viewCount isActive updatedAt createdAt "
      + " featuredImage"
      + " author { username }"
      + " categories { id name }"
      + " tags { id name }"
      + " gallery { id image }"
      + " }"
      + " }",
      { id: blogId }
    );

    const blog = data.adminBlog;
    if (!blog) {
      throw new Error("Blog not found.");
    }

    const featuredWrapper = document.getElementById("featuredImageWrapper");
    const featuredImage = document.getElementById("featuredImage");
    if (blog.featuredImage) {
      featuredImage.src = blog.featuredImage;
      featuredWrapper.style.display = "block";
    } else {
      featuredWrapper.style.display = "none";
    }

    document.getElementById("blogTitle").textContent = blog.title || "-";
    document.getElementById("blogSlug").textContent = blog.slug || "-";
    document.getElementById("blogShortDescription").textContent = blog.shortDescription || "-";
    document.getElementById("blogDescription").textContent = stripHtml(blog.description);
    document.getElementById("blogAuthor").textContent = authorName(blog.author);
    document.getElementById("blogViewCount").textContent = blog.viewCount || 0;
    document.getElementById("blogStatus").textContent = blog.isActive ? "Active" : "Inactive";
     document.getElementById("blogCreated").textContent = formatDate(blog.createdAt);
    document.getElementById("blogUpdated").textContent = formatDate(blog.updatedAt);

    const categoryNames = (blog.categories || []).map(function (item) { return item.name; });
    const tagNames = (blog.tags || []).map(function (item) { return item.name; });

    document.getElementById("blogCategories").textContent = categoryNames.length ? categoryNames.join(", ") : "-";
    document.getElementById("blogTags").textContent = tagNames.length ? tagNames.join(", ") : "-";

    renderGallery(blog.gallery || []);
  } catch (error) {
    setBlogDetailError(error.message || "Failed to load blog detail.");
  }
}

loadBlogDetail();
</script>
</body>
</html>
