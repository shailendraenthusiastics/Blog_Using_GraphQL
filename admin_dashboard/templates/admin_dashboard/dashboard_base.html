<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Base</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f4f6; color: #111827; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: #e5e7eb; border-right: 1px solid #cbd5e1; padding: 20px 14px; }
    .sidebar h2 { margin: 0 0 24px; font-size: 28px; color: #1f2937; }
    .nav-link { display: block; color: #2563eb; text-decoration: none; font-size: 32px; margin: 14px 0; }
    .content { flex: 1; padding: 20px 18px; }
    .panel { background: #fff; border: 1px solid #d1d5db; border-radius: 8px; padding: 20px; }
    .muted { color: #6b7280; font-size: 20px; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>DASHBOARD</h2>
      <a class="nav-link" href="/admin-dashboard/dashboard/">Home</a>
      <a class="nav-link" href="/admin-dashboard/dashboard/blogs/">Blogs</a>
      <a class="nav-link" href="/admin-dashboard/dashboard/categories/">Categories</a>
      <a class="nav-link" href="/admin-dashboard/dashboard/tags/">Tags</a>
    </aside>

    <main class="content">
      <div class="panel">
        <p class="muted">Static base scaffold for admin dashboard pages.</p>
      </div>
    </main>
  </div>
</body>
</html>
